<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Invoice Preview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:#f8f9fa}.pdf-frame{height:90vh;border:none;width:100%}</style>
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark mb-3"><div class="container-fluid"><a class="navbar-brand" href="/">Invoice Preview</a></div></nav>
    <main class="container">
      <div id="previewContainer" class="card p-3">
        <h5>Invoice Preview</h5>
        <p class="text-muted">If your backend returns a PDF URL, it will be embedded here. If it returns a blob, the parent page will open this URL.</p>
        <div id="frameHolder">No preview available. Open from the main page after generating an invoice.</div>
      </div>
    </main>
    <script>
      // allow opening a PDF URL via query param: ?url=
      const qp = new URLSearchParams(location.search);
      const url = qp.get('url');
      if (url) {
        const holder = document.getElementById('frameHolder');
        holder.innerHTML = `<iframe class="pdf-frame" src="${url}"></iframe>`;
      }
    </script>
  </body>
</html>
